[workspace]
members = ["capi"]

[package]
name = "rediocash-api"
version = "0.1.0"
edition = "2024"

[dependencies]
dlopen2 = "0.8.0"
dlopen2_derive = "0.4.1"

#libc = "0.2.172"
int-enum = "1.2"
smallbox = "0.8.6"
parking_lot = "0.12.4"
thiserror = "2.0.12"
derive_more = {version = "2.0.1", features = ["display"]}
derive-enum-from-into = "0.2.0"

serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
dyn_serde = "1.0.2"

[features]
default = ["plugin", "loader"]
plugin = []
loader = ["plugin"]

